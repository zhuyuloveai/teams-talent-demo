server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo_transaction}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:carddemo}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

client:
  card-service:
    base-url: ${CARD_SERVICE_URL:http://localhost:8083}
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8084}
  marketing-service:
    base-url: ${MARKETING_SERVICE_URL:http://localhost:8087}
  ledger-service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8089}
  connect-timeout: 3s
  read-timeout: 3s

# REQ-2026-002：补卡费接口仅接受 card-service 的服务 token（002-A007）
iam:
  token:
    secret: ${IAM_TOKEN_SECRET:carddemo-demo-secret-change-me}
internal:
  service-name: ${INTERNAL_SERVICE_NAME:transaction-service}
  allowed-callers: ${INTERNAL_ALLOWED_CALLERS:card-service}

marketing:
  enabled: ${MARKETING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json

logging:
  level:
    com.carddemo: INFO
