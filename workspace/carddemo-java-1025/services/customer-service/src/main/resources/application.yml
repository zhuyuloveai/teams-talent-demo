server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo_customer}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:carddemo}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json

logging:
  level:
    com.carddemo: INFO

# REQ-2026-002：收卡地址接口的身份边界（002-C04）
iam:
  token:
    secret: ${IAM_TOKEN_SECRET:carddemo-demo-secret-change-me}
internal:
  service-name: ${INTERNAL_SERVICE_NAME:card-service}
