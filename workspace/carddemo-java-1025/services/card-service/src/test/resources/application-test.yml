spring:
  datasource:
    url: jdbc:h2:mem:carddb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate

# 单测中关闭后台 worker（真实恢复路径由独立 Compose 验证）
card:
  workers:
    enabled: false
