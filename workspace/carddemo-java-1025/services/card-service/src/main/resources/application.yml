server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: card-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo_card}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:carddemo}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json

logging:
  level:
    com.carddemo: INFO

# REQ-2026-002：本地演示配置（模拟值，投产前待确认，见 PRD §12）
card:
  iam:
    token:
      secret: ${IAM_TOKEN_SECRET:carddemo-demo-secret-change-me}
  number:
    key: ${CARD_NUMBER_KEY:local-demo-card-number-key}
  notification:
    delivery-enabled: ${CARD_NOTIFICATION_ENABLED:true}
  alert:
    frequency-threshold: ${CARD_ALERT_THRESHOLD:3}
    sweep-interval-ms: ${CARD_ALERT_SWEEP_MS:60000}

replacement:
  fee:
    # SIMULATION：白金卡免收，其余 50.00（原文 §5 BR-LOST-03，正式定价待确认）
    amount: ${REPLACEMENT_FEE_AMOUNT:50.00}
  export:
    max-rows: ${REPLACEMENT_EXPORT_MAX_ROWS:1000}

client:
  customer-service:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  transaction-service:
    base-url: ${TRANSACTION_SERVICE_URL:http://localhost:8085}
  connect-timeout: ${CLIENT_CONNECT_TIMEOUT:3s}
  read-timeout: ${CLIENT_READ_TIMEOUT:3s}
