schemaVersion: 1
id: icode-miner-diff
name: Pattern mining (code snippets)
description: Analyzes local code snippets in the repository context, summarizes development patterns, and archives them to the repository's .icode-knowledge/miner/
definitionVersion: "0.1.0"

input:
  repositories:
    type: array
    items:
      type: repository
    required: true
    minItems: 1
    maxItems: 1
  scenario:
    type: string
    required: true
  snippets:
    type: array
    items:
      type: string
    required: true
  summaryTemplate:
    type: string

output:
  miner:
    relativeTo: repository
    path: .icode-knowledge/miner

build:
  skill:
    name: icode-miner-diff
    defaultPrompt: |
      Summarize the development patterns shown by the given code snippets in the repository "${repository.name}".

      Pass the input file when running the preparation script: ${inputFile.path}. The script lists all inputs, output locations and rules for this run; then follow its output.
