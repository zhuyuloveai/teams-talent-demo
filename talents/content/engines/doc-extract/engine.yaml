schemaVersion: 1
id: doc-knowledge-extract
name: Business knowledge extraction
description: Extracts business rules, ubiquitous language terms and a data dictionary from requirement and design documents, citing the source of each item
definitionVersion: "0.1.0"

input:
  documents:
    type: array
    items:
      type: document
    required: true
    minItems: 1
    maxItems: 1
  focus:
    type: string

output:
  knowledge:
    relativeTo: managed
    path: doc-knowledge

build:
  skill:
    name: doc-knowledge-extract
    defaultPrompt: |
      Extract business rules, ubiquitous language terms and a data dictionary from the selected document set, citing the source of each item.

      Pass the input file when running the preparation script: ${inputFile.path}. The script lists all inputs, output locations and rules for this run; then follow its output.

# On update the input file carries the previous artifact and the document changes (added, modified and deleted files); revise only the affected entries.
update:
  skill:
    name: doc-knowledge-extract
    defaultPrompt: |
      Revise the existing business knowledge based on the document changes: change only the affected entries, and for deleted documents mark the knowledge that cites them.

      Pass the input file when running the preparation script: ${inputFile.path}.
