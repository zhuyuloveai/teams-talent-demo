schemaVersion: 1
id: db-schema
name: Database schema index
description: Reconstructs tables, columns, constraints and table relations from Flyway migration scripts and JPA entities for the agent to query
definitionVersion: "0.3.1"

# One repository; schemas can limit indexing to some schemas (one per line); when empty, all are indexed.
input:
  repositories:
    type: array
    items:
      type: repository
    required: true
    minItems: 1
    maxItems: 1
  schemas:
    type: array
    items:
      type: string

build:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}", "--full"]

update:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]

output:
  index:
    relativeTo: repository
    path: .icode-knowledge/db-schema

applications:
  - name: Table schema query
    type: mcp
    command: db-schema
    args: [serve, --mcp]

install:
  command: python3
  args: ["-m", "pip", "install", "--user", "db-schema-indexer==0.3.1"]

uninstall:
  description: Uninstalls db-schema-indexer; keeps .icode-knowledge/db-schema in the repository and the task records.
  command: python3
  args: ["-m", "pip", "uninstall", "-y", "db-schema-indexer"]

check:
  command: python3
  args: ["${package.root}/scripts/run.py", "--check"]
