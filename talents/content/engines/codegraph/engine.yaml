schemaVersion: 1
id: codegraph
name: Codegraph
description: Builds a queryable knowledge index for a repository, or for each sub-repository in a repository set
definitionVersion: "0.1.0"

# Choose one source: a task selects one repository, or one repository set (run per sub-repository).
# Both kinds of task write the index inside the repository: set tasks write it at the root of each sub-repository, not at the set root.
input:
  repositories:
    type: array
    items:
      type: repository
    minItems: 1
    maxItems: 1
  repositorySet:
    type: repositorySet

build:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]
  platforms:
    windows:
      command: py
      args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]

update:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]
  platforms:
    windows:
      command: py
      args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]

autoSync:
  supported: true
  description: Watches and syncs only the MCP default project (the repository resolved from the startup directory) while the service is running; other repositories queried explicitly through projectPath are not synced automatically, and syncing stops when watching stops.

output:
  index:
    relativeTo: repository
    path: .codegraph

applications:
  - name: MCP query
    type: mcp
    command: codegraph
    args: [serve, --mcp]

# Install codegraph v1.6.0 (official install script, non-interactive). After installing, make sure the codegraph directory (on macOS/Linux
# ~/.local/bin) is on the PATH of the iCode Knowledge backend process; see README.
install:
  platforms:
    macos:
      command: sh
      args: ["-c", "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | CODEGRAPH_VERSION=v1.6.0 sh"]
    linux:
      command: sh
      args: ["-c", "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | CODEGRAPH_VERSION=v1.6.0 sh"]
    windows:
      command: powershell
      args: ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "$env:CODEGRAPH_VERSION = 'v1.6.0'; irm https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.ps1 | iex"]

# Self-check before every build and update: the same environment check and codegraph lookup as the build, then codegraph --version
uninstall:
  description: Removes the whole official CodeGraph installation (all versions and the bundled runtime) and its command entry points; keeps the .codegraph artifacts in repositories and the iCode Knowledge task records. Other tools may share this installation, so stop using them first.
  command: python3
  args: ["${package.root}/scripts/uninstall.py"]
  platforms:
    windows:
      command: py
      args: ["${package.root}/scripts/uninstall.py"]

check:
  command: python3
  args: ["${package.root}/scripts/run.py", "--check"]
  platforms:
    windows:
      command: py
      args: ["${package.root}/scripts/run.py", "--check"]
