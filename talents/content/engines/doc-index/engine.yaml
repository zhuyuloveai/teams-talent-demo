schemaVersion: 1
id: doc-rag
name: Document RAG search
description: Builds a hybrid BM25 + vector search index for a document set and finds the relevant passages for a question
definitionVersion: "0.1.0"

# The document source is fixed to the snapshot taken by the pre-run check; on update the input file carries the last built version and the changed files.
input:
  documents:
    type: array
    items:
      type: document
    required: true
    minItems: 1
    maxItems: 1
  embeddingModel:
    type: string

build:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}", "--rebuild"]

update:
  command: python3
  args: ["${package.root}/scripts/run.py", "--input-file", "${inputFile.path}"]

output:
  index:
    relativeTo: managed
    path: rag-index

applications:
  - name: MCP query
    type: mcp
    command: docs-rag
    args: [serve, --mcp]

install:
  command: python3
  args: ["-m", "pip", "install", "--user", "icode-docs-rag==0.4.2"]

uninstall:
  description: Uninstalls icode-docs-rag; keeps the built indexes and task records.
  command: python3
  args: ["-m", "pip", "uninstall", "-y", "icode-docs-rag"]

check:
  command: python3
  args: ["${package.root}/scripts/run.py", "--check"]
