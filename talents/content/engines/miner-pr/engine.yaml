schemaVersion: 1
id: icode-miner-pr
name: Pattern mining (PRs)
description: Analyzes merged PRs in the repository context, summarizes development patterns, and archives them to the repository's .icode-knowledge/miner/
definitionVersion: "0.1.0"

input:
  repositories:
    type: array
    items:
      type: repository
    required: true
    minItems: 1
    maxItems: 1
  pullRequests:
    type: array
    items:
      type: pullRequest
    required: true
    minItems: 1
  scenario:
    type: string
  summaryTemplate:
    type: string

output:
  miner:
    relativeTo: repository
    path: .icode-knowledge/miner

build:
  skill:
    name: icode-miner-pr
    defaultPrompt: |
      Summarize the development patterns shown by the selected PRs in the repository "${repository.name}".

      Pass the input file when running the preparation script: ${inputFile.path}. The script lists all inputs, output locations and rules for this run; then follow its output.
